name: Registrar uma tarefa técnica
description: Refatoração, configuração, documentação ou outra tarefa interna
title: "[Tarefa] "
labels: ["documentation"]
body:
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: O que precisa ser feito e por quê.
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Lista de passos
      placeholder: |
        - [ ] Passo 1
        - [ ] Passo 2
    validations:
      required: true
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options:
        - Refatoração
        - Configuração / infraestrutura
        - Banco de dados
        - Documentação
        - Segurança
        - Outro
    validations:
      required: true
  - type: dropdown
    id: prioridade
    attributes:
      label: Prioridade sugerida
      options:
        - Alta
        - Média
        - Baixa
    validations:
      required: true
  - type: textarea
    id: riscos
    attributes:
      label: Riscos ou dependências
